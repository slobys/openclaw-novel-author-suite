schema_version: '1.3'
pipeline_profile: novel_author_balanced_v5.3.2_engine_0.4.5
source_of_truth: true
agent_id: novel-author

authority:
  business_facts: novel-engine
  orchestration_state: .novel-runtime/jobs
  agent_side_evidence: .novel-runtime/evidence
  local_mirror_only: .novel-runtime/derived
  forbid_business_fact_sources: [chat_history, DREAMS.md, memory/, exports/, .novel-runtime/derived]

defaults:
  preferred_target_han_chars: 2600
  flexible_han_chars: [2000, 3200]
  hard_min_han_chars: 2000
  max_auto_revision_rounds: 1
  additional_revision_requires_user_decision: true
  max_same_error_failures: 2
  max_active_jobs_per_project: 1
  max_active_chapter_writers_per_project: 1
  request_id: '{job_id}-ch{chapter_no}'
  project_writing_contract_overrides_defaults: true
  recent_signature_window: 10
  genre_window: 5
  memory_short_items: 5
  memory_mid_items: 12
  memory_long_top_k: 8
  reviewer_thinking: medium
  reviewer_context: isolated
  critical_chapter_thinking: high
  critical_chapter_requires: [explicit_user_request, volume_boundary, major_reversal, finale]

state_machine:
  normal_path: [pending, preparing, drafting, length_gate, auditing, quality_gate, precommit_gate, committing, closing, integrity_gate, committed]
  exceptional_states: [failed, blocked, reconciling]
  require_exact_next_state: true
  require_latest_revision_for_mutation: true
  committed_is_terminal: true

safety:
  strict_serial_chapters: true
  isolated_child_sessions: spawn_required_reviewers_then_sessions_yield
  independent_review_sessions_required: true
  reuse_review_sessions_within_same_chapter: true
  replacement_session_only_when: [unreachable, failed, timed_out, wrong_role]
  forbid_semantic_rerun_on: [schema_error, payload_error, permission_error, network_error, receipt_format_error]
  forbid_parallel_project_writers: true
  forbid_commit_as_probe: true
  forbid_auto_retry_on: [401, 403, 404, schema_error, deterministic_business_rejection]
  commit_uncertain_action: novel_commit_status_before_retry
  title_contract:
    title_field: pure_title_without_chapter_number
    body_contains_heading: false
    chapter_number_renderer_count: 1

workflow:
  stage_00_capability_and_integrity_preflight:
    inputs: [TOOLS.md, runtime_tool_registry]
    actions:
      - novel_project_list
      - novel_project_status
      - novel_project_config_read
      - verify_required_tool_capabilities
      - validate_server_capabilities
      - novel_project_integrity_check_repair_false_when_needed
    outputs:
      - .novel-runtime/evidence/{job_id}/capability-preflight.json
      - .novel-runtime/evidence/{job_id}/writing-contract.json
      - .novel-runtime/evidence/{job_id}/server-capabilities.json
    hard_gate:
      - required_v5_server_tools_available
      - project_status_readable
      - server_gate_verified
      - no_other_active_project_job
      - no_unresolved_integrity_failure

  stage_10_prepare:
    state: preparing
    actions:
      - novel_prepare_chapter
      - novel_dynamic_state_context_if_narrow_query_needed
      - novel_memory_search_if_additional_history_needed
      - novel_story_ledger_query_if_additional_ledger_context_needed
      - novel_foreshadowing_due_if_needed
    inputs: [project_id, current_project_status, project_config]
    outputs:
      - .novel-runtime/evidence/{job_id}/chapter-{chapter_no}/context-package.json
    hard_gate:
      - chapter_no_is_engine_authorized_next_chapter
      - previous_required_closure_is_complete
      - minimum_engine_context_package_received
      - all_important_context_has_engine_traceability

  stage_20_plan_and_draft:
    state: drafting
    planning:
      alternatives: 2-3
      scene_count: adaptive_default_3_5
      beat_count: adaptive_default_6_12
      stable_beat_ids: true
      require:
        - protagonist_costly_choice
        - causal_progression
        - relationship_or_information_or_promise_change
        - recent_pattern_variation
        - reader_experience_alignment
    outputs:
      - .novel-runtime/evidence/{job_id}/chapter-{chapter_no}/plan.json
      - .novel-runtime/evidence/{job_id}/chapter-{chapter_no}/chapter.md

  stage_30_length_gate:
    state: length_gate
    validator: skills/novel-author/scripts/chapter_length.py
    args_from_project_config: [hard_min, target_min, target_max]
    semantics:
      hard_min: commit_minimum
      target_min: preferred_target_not_minimum
      target_max: preferred_upper_bound_not_hard_failure
    accept_without_revision_when: han_chars_gte_resolved_hard_min
    revise_only_when: han_chars_below_resolved_hard_min
    automatic_revision:
      max_rounds: 1
      before_receipt_required: true
      validator: skills/novel-author/scripts/draft_revision_gate.py
      after_revision_requires:
        - body_sha256_changed
        - han_chars_gte_resolved_hard_min
      unchanged_body_action: blocked
      still_below_minimum_action: blocked
      second_attempt_action: blocked
    commentary_does_not_count_as_revision: true
    hard_gate:
      - han_chars_gte_resolved_hard_min
      - revision_receipt_pass_when_revision_was_needed
    outputs:
      - .novel-runtime/evidence/{job_id}/chapter-{chapter_no}/length-r0.json
      - .novel-runtime/evidence/{job_id}/chapter-{chapter_no}/draft-revision-r1.json

  stage_40_engine_audit:
    state: auditing
    actions:
      - novel_logic_audit_prepare_once_per_chapter_unless_engine_facts_changed
      - perform_17_category_audit_once_per_body_hash
      - novel_chapter_audit_record
    categories: [facts, timeline, space, motivation, knowledge, worldRules, resources, causality, foreshadowing, originality, voice, sceneDynamics, promiseFairness, relationshipContinuity, emotionCurve, fatigueRisk, oppositionPressure]
    hard_gate:
      - engine_audit_decision_is_pass
      - all_project_required_categories_present
      - blocking_issue_count_is_zero
      - audit_body_sha256_matches_final_body

  stage_45_independent_quality:
    state: quality_gate
    actions:
      - create_or_reuse_isolated_continuity_auditor
      - create_or_reuse_isolated_reader_editor
      - save_spawn_run_id_child_session_key_and_session_id
      - sessions_yield_until_required_completion_events
      - reconcile_with_subagents_or_sessions_list
      - read_final_reviews_with_sessions_history
      - skills/novel-author/scripts/independent_audit_gate.py
      - use_independent_receipt_engine_reviews_verbatim
      - build_provisional_chapter_signature
      - skills/novel-author/scripts/genre_promise.py
      - skills/novel-author/scripts/quality_gate.py
      - novel_chapter_quality_record
    reviewer_runtime:
      normal_chapter: {context: isolated, thinking: medium}
      critical_chapter: {context: isolated, thinking: high}
      critical_when: [explicit_user_request, volume_boundary, major_reversal, finale]
    reviewer_checks:
      continuity-auditor: [facts, timeline, knowledgeBoundary, stateContinuity, causality, promiseContinuity, relationshipContinuity]
      reader-editor: [readability, pacing, repetition, genreExperience, hookQuality, characterAgency]
      chapter_audit_required_count_is_not_reviewer_count: true
    engine_quality_payload_contract:
      reviewer_check_value:
        canonical_object: {status: 'pass|note|warning|not_applicable', evidence: optional_string}
        exact_status_string_compatible: true
        description_only_string_forbidden: true
        status_plus_description_string_forbidden: true
      reviewer_objects_source: independent-receipt.json.engineReviews
      mutate_reviews_after_local_gate: false
      identical_body_hash_fields:
        - canonical_content_sha256
        - continuityReview.bodySha256
        - readerReview.bodySha256
        - genreGate.bodySha256
        - signature.bodySha256
      genre_gate_requires: [bodySha256, pass_true_or_genrePass_true]
      local_genreGatePass_is_not_engine_pass_field: true
      signature_requires: [bodySha256, at_least_one_experience_or_structure_field]
      validate_complete_payload_before_first_tool_call: true
    review_outcome_policy:
      non_blocking_issue_severities: [note, warning]
      blocking_issue_severities: [error, block, fatal]
      revise_only_on: [blocking_issue, conclusion_revise, conclusion_block]
      same_chapter_new_body_hash: reuse_existing_reviewer_sessions_and_issue_fresh_receipts
      schema_or_payload_failure: correct_payload_once_without_semantic_rerun
      second_schema_or_payload_failure: blocked_with_raw_error_and_redacted_payload
    outputs:
      - .novel-runtime/evidence/{job_id}/chapter-{chapter_no}/continuity-review.json
      - .novel-runtime/evidence/{job_id}/chapter-{chapter_no}/reader-review.json
      - .novel-runtime/evidence/{job_id}/chapter-{chapter_no}/current-signature.json
      - .novel-runtime/evidence/{job_id}/chapter-{chapter_no}/quality-receipt.json
      - .novel-runtime/evidence/{job_id}/chapter-{chapter_no}/engine-quality-receipt.json
    hard_gate:
      - reviewer_sessions_are_real_and_distinct_from_writer
      - independent_audit_pass_is_true
      - genre_gate_has_no_severe_hard_block
      - local_quality_pass_is_true
      - engine_quality_pass_is_true
      - all_quality_receipts_match_final_body_hash
      - engine_quality_payload_contract_complete
      - reviewer_checks_use_canonical_status_objects

  stage_50_precommit_gate:
    state: precommit_gate
    actions:
      - skills/novel-author/scripts/chapter_payload_gate.py
      - skills/novel-author/scripts/precommit_gate.py
    outputs:
      - .novel-runtime/evidence/{job_id}/chapter-{chapter_no}/payload-receipt.json
      - .novel-runtime/evidence/{job_id}/chapter-{chapter_no}/gate-receipt.json
    hard_gate:
      - gate_pass_is_true
      - payload_pass_is_true
      - engine_audit_and_quality_receipts_exist
      - receipt_body_hash_matches_commit_body

  stage_60_commit:
    state: committing
    action: novel_commit_chapter
    idempotency_key: '{job_id}-ch{chapter_no}'
    hard_gate:
      - engine_confirms_chapter_number
      - engine_confirms_body_sha256
      - engine_receipt_reports_server_gates
    uncertain_delivery:
      next_state: reconciling
      action: novel_commit_status
      retry_before_engine_query: false
      only_retry_when_status: not_found
      retry_request_id_policy: reuse_same_request_id_and_identical_payload

  stage_70_server_closure:
    state: closing
    actions:
      - novel_causal_event_record_for_applicable_changes
      - novel_foreshadowing_upsert_for_applicable_changes
      - novel_story_ledger_upsert_for_promise_relationship_opposition_signature_arc_drift
      - novel_dynamic_state_update
      - novel_memory_record
      - novel_chapter_closure_record
      - novel_chapter_closure_status
    operation_policy:
      completed_requires_durable_engine_evidence: true
      skipped_requires_reason: true
      all_records_bind_to_current_body_sha256: true
      idempotent_cas_updates_required: true
      evidence_location: operations_each_item_not_top_level
      evidence_type: project_relative_json_path_string
      read_closure_status_before_payload_repair: true
      schema_repair_must_not_repeat_durable_ledger_writes: true
      standard_evidence_paths:
        causalEvents: story/causal-events.json
        foreshadowing: story/foreshadowing.json
        promisePayoff: story/ledgers/promises.json
        relationshipGraph: story/ledgers/relationships.json
        oppositionClocks: story/ledgers/opposition-clocks.json
        chapterSignature: story/ledgers/chapter-signatures.json
        dynamicState: story/dynamic/state.json
        memoryIndex: story/memory/index.json
    hard_gate:
      - engine_closure_status_is_complete
      - engine_closure_body_binding_valid

  stage_80_integrity_gate:
    state: integrity_gate
    actions:
      - skills/novel-author/scripts/chapter_closure.py_verify_as_local_evidence
      - novel_project_integrity_check_repair_false
    hard_gate:
      - engine_commit_confirmed
      - engine_body_hash_matches_gate_body_hash
      - server_closure_complete
      - engine_integrity_pass_is_true

  stage_90_finish:
    state: committed
    actions:
      - run_narrative_fatigue_check
      - run_arc_audit_when_checkpoint_due
      - run_outline_drift_when_checkpoint_due
      - permit_next_chapter
    checkpoint_every_committed_chapters: 5
    drift_policy:
      correction_horizon_chapters: 3-8
      silently_rewrite_committed_history: false

failure_policy:
  identical_error_second_failure: blocked
  unblock_requires_operator_resolution: true
  unresolved_integrity_failure: stop_project
  preserve_successful_previous_chapters: true
  auto_retry_whole_chapter: false
  auto_continue_after_blocked_or_reconciling: false
  local_mirror_conflict_with_engine: invalidate_and_rebuild_local_mirror
  reviewer_schema_error_does_not_invalidate_semantic_reviews: true
  reviewer_schema_retry_limit: 1
  reviewer_schema_retry_action: rebuild_payload_from_original_session_results
  forbid_reviewer_respawn_for_schema_retry: true
  forbid_logic_audit_prepare_for_quality_schema_retry: true
  closure_schema_retry_limit: 1
  closure_schema_retry_action: read_status_then_rebuild_only_closure_payload
  forbid_repeating_successful_ledger_writes_for_closure_schema_retry: true

completion_requires:
  - engine_commit_confirmed
  - body_hash_consistent_across_audit_quality_gate_and_engine
  - independent_quality_pass
  - server_closure_complete
  - engine_integrity_pass
  - job_state_committed
  - truthful_user_report
