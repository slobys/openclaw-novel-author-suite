schema_version: "2.1.0"
pipeline_profile: scene_bound_auto_v1.2
source_of_truth: true

project:
  name: AI Short Drama Production Pipeline
  agent: drama-producer

default_settings:
  episode_count: auto
  episode_duration:
    default: auto_by_effective_story_beats
    resolved_project_field: 制作规格.实际目标时长秒
    resolution_output: review/duration_resolution.json
  video_aspect_ratio:
    default: "16:9"
    project_field: 制作规格.画幅比例
    preserve_existing_explicit_setting: true
  asset_aspect_ratio_defaults:
    location: "16:9"
    scene: "16:9"
    style: "16:9"
    storyboard: "16:9"
    shot: "16:9"
    character: "9:16"
    animal: "9:16"
    creature: "9:16"
    prop: "9:16"
  scene_binding:
    planner: deepwhite-scene-asset-planner
    authoritative_scene_index: script/scene_index.json
    authoritative_handoff: handoffs/scene_asset_handoff.json
    coverage_gate: gates/scene_asset_coverage_gate.json
    require_full_coverage: true
    forbid_prompt_based_rebinding: true
  continuity_asset_design:
    enabled: true
    skill: deepwhite-scene-pack-builder
    invocation_mode: PIPELINE_BATCH
    base_pass: BASE_ASSET
    shot_gap_pass: SHOT_ASSET_GAP
    prompt_policy: PORTABLE_HARD_LOCK
    lock_mutation_policy: fail_closed
    reference_policy: approved_only
    must_preserve_scene_handoff: true
  asset_demand:
    enabled: true
    skill: deepwhite-asset-demand-resolver
    resolver: scripts/resolve_asset_demand.py
    intent_output: shots/shot_intent_manifest.json
    manifest_output: assets/asset_demand_manifest.json
    coverage_output: assets/reference_coverage_plan.json
    gate_output: gates/asset_demand_coverage_gate.json
    tier_policies:
      series_core: series_library_full_pack
      recurring: progressive_on_demand
      episode_important: on_demand
      background: inline_unless_closeup
    full_pack_tiers: [series_core]
    forbid_episode_block_on_series_library_backfill: true
    require_consumer_shot_ids_for_generation: true
    forbid_orphan_generation: true
    default_angle_pack_mode: on_demand
    allow_text_only_risk_levels: [low]
  prompt_packaging:
    skill: deepwhite-image-prompt-builder
    mode: PACKAGER_ONLY
    preserve_prompt_verbatim: true
    require_lock_hash_match: true
  reference_registry:
    project_snapshot_path: assets/reference_registry.json
    shared_path: /data/openclaw-assets/{project_id}/reference_registry.json
    snapshot_authority: shared_registry_after_hash_verification
    required_status: approved
    require_job_binding: true
    require_payload_sha256: true
    require_file_sha256: true
    require_file_size: true
    reject_statuses: [failed, rejected, superseded, unreviewed]
  asset_visual_review:
    semantic_authority: n8n_structured_visual_qa
    agent_mode: exception_only
    skip_agent_review_when: [registry_status_is_approved, qa_evidence_passed, file_size_and_sha256_match, production_safety_complete, ambiguity_reasons_empty]
    exception_triggers: [qa_evidence_missing_or_invalid, ambiguity_reasons_nonempty, reference_consistency_unknown, identity_consistency_unknown, scene_topology_unknown, video_reference_safety_unknown]
    exception_report: review/asset_review_exceptions.json
    exception_resolution: review/asset_review_resolutions.json
    forbid_full_batch_reinspection: true
  asset_image_naming:
    enabled: true
    scheme: "{project_code}_{asset_id}.png"
    filename_charset: ASCII
    one_filename_per_child_asset: true
    manifest_output: assets/image_naming_manifest.json
  asset_dispatch:
    enabled: true
    skill: deepwhite-n8n-asset-dispatcher
    schema_version: "2.1"
    webhook_path: openclaw-assets
    shared_asset_root_env: OPENCLAW_ASSET_SHARED_ROOT
    default_shared_asset_root: /data/openclaw-assets
    accept_shared_root_from_payload: false
    reference_injection: true
    topological_execution: true
    wait_for_registry: true
    registry_snapshot: assets/reference_registry.json
    async_fallback: pause_and_resume
    max_submit_attempts: 3
    canonical_entrypoint: scripts/submit_asset_job.py
    forbid_direct_skill_sender: true
    success_requires_all_required_assets_approved: true
    default_job_settings:
      model: gemini-3.1-flash-image
      image_size: 2K
      review_model: gemini-2.5-flash
      review_min_score: 85
      review_max_retries: 2
      max_image_generations: 3
      acceptance_policy: strict_only
    pre_dispatch_gates:
      - scripts/validate_asset_render_specs.py
      - scripts/asset_retry_guard.py
      - payload_body_and_x_openclaw_payload_sha256_match
      - required_reference_count_lte_2
      - prompt_semantic_contradictions_empty
    receiver_contract:
      preserve_signed_payload_body: true
      merge_trusted_runtime_controls_from_webhook_envelope: true
      preserve_fields:
        - asset_lineage_id
        - requirement_sha256
        - revision_reason_code
        - acceptance_policy
        - qa_failure_policy
        - style_contract_sha256
        - supersedes_asset_id
        - identity_fingerprint
    worker_contract:
      retry_with_structured_qa_feedback: true
      strict_terminal_success_status: accepted
      forbid_fallback_as_reusable_or_approved: true
      require_png_magic_for_png_filename: true
      atomically_update_reference_registry: true
      atomically_write_terminal_job_manifest: true
    registry_qa_contract:
      review_authority: n8n_structured_visual_qa
      require_pass: true
      require_zero_hard_failures: true
      require_production_safety_complete: true
      require_ambiguity_reasons_empty: true
      require_reference_injection_evidence_when_declared: true
    opt_out_phrases:
      - 只输出提示词
      - 不要生图
      - 不要生成图片
      - 不要发送到n8n
      - 不要发送到 n8n
      - 仅制作前期资料
  video_dispatch:
    enabled: true
    skill: deepwhite-n8n-video-dispatcher
    require_scene_binding_gate: true
    require_video_prompt_gate: true
    status_after_http_2xx: webhook_accepted_unverified
    execution_confirmed_by: [n8n_execution_id, provider_task_id, fixed_job_output_directory, trusted_callback]

workflow:
  stage_00_initialize:
    name: Project Initialization and Story Analysis
    action: [create_project, analyze_story]
    outputs: [project.json, input/story_analysis.md]
    success_status: initialized

  stage_10_screenplay:
    name: Stable Scene-ID Screenplay
    skill: deepwhite-screenwriting-v1
    inputs: [input/story_analysis.md, input/series_episode_context.json]
    outputs: [script/story_outline.md, script/episode_script.md, script/scene_index.json, review/script_check.md]
    hard_gate: [every_scene_has_stable_scene_id, critical_issues == 0]
    success_status: screenplay_ready

  stage_20_continuity:
    name: Machine-readable Continuity World State
    skill: deepwhite-continuity-worldstate-zh
    invocation: {mode: AUTO_MACHINE_MODE}
    inputs: [script/episode_script.md, script/scene_index.json]
    outputs: [world/characters.json, world/locations.json, world/props.json, continuity/continuity_handoff.json]
    validator: deepwhite-continuity-worldstate-zh/scripts/validate_world_state_bundle.py
    validator_args: [--project-root ., --scene-index script/scene_index.json]
    hard_gate: [passed == true, scene_coverage_ratio == 1.0, zero_unknown_references == true]
    success_status: continuity_ready

  stage_25_scene_asset_plan:
    name: Deterministic Scene Asset Planning
    skill: deepwhite-scene-asset-planner
    inputs: [script/episode_script.md, script/scene_index.json, continuity/continuity_handoff.json, input/series_episode_context.json, assets/actual_asset_manifest.json]
    outputs: [assets/scene_asset_plan.json, assets/location_asset_requirements.json, handoffs/scene_asset_handoff.json, gates/scene_asset_coverage_gate.json]
    validator: deepwhite-scene-asset-planner/scripts/validate_scene_asset_plan.py
    hard_gate: [scene_asset_coverage_gate.passed == true, scene_coverage_ratio == 1.0, primary_binding_ratio == 1.0, authoritative_scene_index_used == true]
    success_status: scene_assets_planned

  stage_27_shot_intent:
    name: Pre-generation Shot Intent and Visual Demand Discovery
    skill: deepwhite-asset-demand-resolver
    invocation: {mode: SHOT_INTENT_ONLY}
    inputs: [project.json, script/episode_script.md, script/scene_index.json, continuity/continuity_handoff.json, handoffs/scene_asset_handoff.json]
    outputs: [shots/shot_intent_manifest.json, shots/shot_intent_bindings.json]
    constraints: [not_a_final_shotlist, no_image_generation, inherit_scene_asset_handoff_exactly]
    hard_gate: [every_intent_has_shot_id_and_scene_binding, every_visual_demand_has_consumer_shot_ids]
    success_status: shot_intent_ready

  stage_28_asset_demand_resolution:
    name: Minimum Asset Demand Resolution
    skill: deepwhite-asset-demand-resolver
    runner: scripts/resolve_asset_demand.py
    runner_args: [--intent, shots/shot_intent_manifest.json, --registry, assets/reference_registry.json, --manifest-out, assets/asset_demand_manifest.json, --coverage-out, assets/reference_coverage_plan.json, --gate-out, gates/asset_demand_coverage_gate.json]
    inputs: [shots/shot_intent_manifest.json]
    optional_inputs: [assets/reference_registry.json]
    outputs: [assets/asset_demand_manifest.json, assets/reference_coverage_plan.json, gates/asset_demand_coverage_gate.json]
    hard_gate:
      - "passed == true"
      - "coverage_ratio == 1.0"
      - "orphan_generation_asset_ids == []"
    success_status: asset_demand_resolved

  stage_30_base_continuity_design:
    name: Demand-bound Base Continuity Asset Design
    skill: deepwhite-scene-pack-builder
    invocation: {mode: PIPELINE_BATCH, pass: BASE_ASSET}
    inputs: [project.json, script/scene_index.json, world/, continuity/continuity_handoff.json, assets/scene_asset_plan.json, assets/location_asset_requirements.json, handoffs/scene_asset_handoff.json, shots/shot_intent_manifest.json, assets/asset_demand_manifest.json]
    outputs: [assets/continuity/, assets/asset_list.json, assets/expanded_asset_list.base.json, assets/asset_dependency_graph.base.json, assets/reference_plan.base.json]
    constraints: [preserve_scene_id_location_id_and_location_asset_id, do_not_replace_scene_asset_handoff, expand_only_generation_wave_0, do_not_generate_full_angle_pack_for_episode_important]
    success_status: base_assets_designed

  stage_32_base_prompt_packaging:
    name: Verbatim Base Prompt Packaging
    skill: deepwhite-image-prompt-builder
    invocation: {mode: PACKAGER_ONLY, source_pass: BASE_ASSET}
    inputs: [assets/expanded_asset_list.base.json, assets/reference_plan.base.json, handoffs/scene_asset_handoff.json, assets/asset_demand_manifest.json, gates/asset_demand_coverage_gate.json]
    outputs: [prompts/base_assets/, assets/image_naming_manifest.json, dispatch/asset_jobs/base-assets.json]
    validator: deepwhite-image-prompt-builder/scripts/validate_packager_handoff.py
    validator_args: [--expanded assets/expanded_asset_list.base.json, --job dispatch/asset_jobs/base-assets.json, --out gates/packager_handoff_gate.base.json]
    job_contract:
      demand_manifest_path: assets/asset_demand_manifest.json
      demand_gate_path: gates/asset_demand_coverage_gate.json
      demand_wave: 0
      default_angle_pack_mode: on_demand
    hard_gate: [all_lock_hashes_match == true, scene_bindings_unchanged == true, packaged_asset_ids_equal_demand_wave_0 == true]
    success_status: base_asset_job_ready

  stage_35_base_asset_dispatch:
    name: Generate and Verify Base Anchors Through n8n
    skill: deepwhite-n8n-asset-dispatcher
    invocation: {mode: CONTINUITY_V2, stage_filter: anchor, demand_wave: 0, wait_for_registry: true, registry_snapshot: assets/reference_registry.json}
    command: >-
      python3 scripts/submit_asset_job.py
      --job projects/{project_id}/dispatch/asset_jobs/base-assets.json
    inputs: [dispatch/asset_jobs/base-assets.json]
    outputs: [dispatch/last_submission.json, assets/reference_registry.json]
    hard_gate: [all_demand_wave_0_assets_approved == true, orphan_generation_asset_count == 0, registry_job_binding_valid == true, registry_payload_sha256_valid == true, registry_file_hashes_valid == true]
    success_status: base_assets_approved

  stage_40_preliminary_shotlist:
    name: Draft Shotlist from Shot Intent and Approved Anchors
    skill: deepwhite-shotlist-builder-zh-user
    mode: AUTO_GATE_MODE
    inputs: [script/episode_script.md, script/scene_index.json, continuity/continuity_handoff.json, handoffs/scene_asset_handoff.json, shots/shot_intent_manifest.json, shots/shot_intent_bindings.json, assets/asset_demand_manifest.json, assets/reference_registry.json]
    outputs: [shots/shotlist.draft.md, shots/shot_scene_bindings.draft.json]
    hard_gate: [every_draft_shot_inherits_scene_handoff, every_draft_shot_traces_to_shot_intent]
    success_status: preliminary_shotlist_ready

  stage_42_shot_asset_gap:
    name: Shot Asset Gap Pass
    skill: deepwhite-scene-pack-builder
    invocation: {mode: PIPELINE_BATCH, pass: SHOT_ASSET_GAP}
    inputs: [shots/shotlist.draft.md, shots/shot_scene_bindings.draft.json, shots/shot_intent_manifest.json, assets/asset_demand_manifest.json, handoffs/scene_asset_handoff.json, assets/continuity/, assets/reference_registry.json]
    outputs: [assets/shot_asset_requests.json, assets/expanded_asset_list.shot.json, assets/asset_dependency_graph.shot.json, assets/reference_plan.shot.json]
    constraints: [expand_only_generation_wave_1, no_full_pack_backfill, every_asset_request_has_consumer_shot_ids]
    success_status: shot_asset_gap_ready

  stage_44_shot_prompt_packaging:
    name: Verbatim Shot Asset Prompt Packaging
    skill: deepwhite-image-prompt-builder
    invocation: {mode: PACKAGER_ONLY, source_pass: SHOT_ASSET_GAP}
    inputs: [assets/expanded_asset_list.shot.json, assets/reference_plan.shot.json, assets/reference_registry.json, assets/asset_demand_manifest.json, gates/asset_demand_coverage_gate.json, handoffs/scene_asset_handoff.json]
    outputs: [prompts/shot_assets/, dispatch/asset_jobs/shot-assets.json]
    validator: deepwhite-image-prompt-builder/scripts/validate_packager_handoff.py
    validator_args: [--expanded assets/expanded_asset_list.shot.json, --job dispatch/asset_jobs/shot-assets.json, --out gates/packager_handoff_gate.shot.json]
    job_contract:
      demand_manifest_path: assets/asset_demand_manifest.json
      demand_gate_path: gates/asset_demand_coverage_gate.json
      demand_wave: 1
      default_angle_pack_mode: on_demand
    hard_gate: [all_lock_hashes_match == true, scene_bindings_unchanged == true, packaged_asset_ids_equal_demand_wave_1 == true]
    success_status: shot_asset_job_ready

  stage_46_derived_asset_dispatch:
    name: Generate and Verify Derived and Shot Assets
    skill: deepwhite-n8n-asset-dispatcher
    invocation: {mode: CONTINUITY_V2, stage_filter: [derived, shot], demand_wave: 1, wait_for_registry: true, registry_snapshot: assets/reference_registry.json}
    command: >-
      python3 scripts/submit_asset_job.py
      --job projects/{project_id}/dispatch/asset_jobs/shot-assets.json
    skip_when: demand_wave_1_generation_count == 0
    hard_gate: [all_required_assets_approved == true, rejected_required_asset_count == 0, failed_required_asset_count == 0, registry_job_binding_valid == true, registry_payload_sha256_valid == true, registry_file_hashes_valid == true]
    success_status: all_required_assets_approved

  stage_48_actual_asset_ingest:
    name: Deterministic Asset Evidence Ingest and Exception Triage
    inputs: [handoffs/scene_asset_handoff.json, assets/reference_registry.json, assets/expanded_asset_list.base.json, assets/expanded_asset_list.shot.json]
    runner: scripts/ingest_asset_evidence.py
    runner_args: [--project-root, "projects/{project_id}"]
    outputs: [assets/actual_asset_manifest.json, assets/observed_asset_state.json, assets/video_reference_manifest.json, gates/asset_evidence_gate.json, review/asset_review_exceptions.json]
    agent_visual_review: only_assets_listed_in_review/asset_review_exceptions.json
    rerun_after_exception_resolution: true
    hard_gate: [asset_evidence_gate.passed == true, every_required_asset_is_readable, every_required_asset_sha256_matches, all_n8n_qa_evidence_valid, all_video_references_are_clean_single_view, manual_visual_review_required_count == 0]
    success_status: actual_assets_ready

  stage_50_final_shotlist:
    name: Final Shotlist and Video Prompts from Actual Assets
    skill: deepwhite-shotlist-builder-zh-user
    mode: AUTO_GATE_MODE
    inputs: [script/episode_script.md, script/scene_index.json, continuity/continuity_handoff.json, handoffs/scene_asset_handoff.json, assets/actual_asset_manifest.json, assets/observed_asset_state.json]
    outputs: [shots/shotlist.md, shots/shot_scene_bindings.json, shots/spatial_blocking.json, shots/timing_plan.json, review/video_prompt_gate_review.json, video_prompts/video_prompt_sheet.md, video_prompts/video_prompt_manifest.json]
    success_status: shotlist_ready

  stage_52_environment_continuity_gate:
    name: Route Anchor Environment Continuity Gate
    validator: deepwhite-shotlist-builder-zh-user/scripts/validate_environment_continuity.py
    inputs: [handoffs/scene_asset_handoff.json, assets/actual_asset_manifest.json, shots/spatial_blocking.json]
    output: gates/environment_continuity_gate.json
    hard_gate: [passed == true, route_anchor_coverage_ratio == 1.0]
    success_status: environment_continuity_passed

  stage_55_shot_binding_gate:
    name: Shot and Prompt Scene Binding Gate
    validator: deepwhite-shotlist-builder-zh-user/scripts/validate_shot_scene_bindings.py
    inputs: [handoffs/scene_asset_handoff.json, script/scene_index.json, assets/actual_asset_manifest.json, gates/environment_continuity_gate.json, shots/shot_scene_bindings.json, video_prompts/video_prompt_manifest.json]
    output: gates/shot_scene_binding_gate.json
    hard_gate: [passed == true, scene_coverage_ratio == 1.0, shot_binding_ratio == 1.0, prompt_binding_ratio == 1.0, authoritative_scene_index_used == true]
    success_status: shot_binding_passed

  stage_60_transition:
    name: Required Boundary Transition Bridges
    skill: deepwhite-shot-transition-builder-zh
    optional: true
    run_when: transition_need_count > 0
    inputs: [shots/shotlist.md, shots/shot_scene_bindings.json, continuity/continuity_handoff.json]
    outputs: [transition/transition_plan.md, gates/transition_gate.json]
    constraint: must_not_change_scene_or_location_binding
    on_prompt_change: rerun_stage_55
    success_status: transition_ready

  stage_65_video_prompt_ready:
    name: Final Video Prompt Readiness
    inputs: [gates/shot_scene_binding_gate.json, gates/environment_continuity_gate.json, review/video_prompt_gate_review.json, video_prompts/video_prompt_manifest.json]
    hard_gate: [shot_scene_binding_gate.passed == true, ready_for_video_prompt_generation == true, timing_plan_total == resolved_duration_seconds]
    success_status: video_prompts_ready

  stage_70_video_dispatch:
    name: Video Job Dispatch to n8n
    skill: deepwhite-n8n-video-dispatcher
    inputs: [project.json, handoffs/scene_asset_handoff.json, assets/actual_asset_manifest.json, assets/video_reference_manifest.json, gates/shot_scene_binding_gate.json, video_prompts/video_prompt_manifest.json]
    outputs: [gates/video_scene_binding_gate.json, "dispatch/video_jobs/{video_job_id}.json", dispatch/last_video_submission.json]
    status_after_http_2xx: webhook_accepted_unverified
    wait_for: [n8n_video_generation_completed, n8n_final_video_composed]

  stage_80_video_result:
    name: Video Result Ingest
    trigger: n8n_video_generation_completed
    failure_status: video_generation_failed
    success_status: video_clips_ready

  stage_90_final_composition:
    name: Final Composition Verification
    trigger: n8n_final_video_composed
    inputs: ["dispatch/video_jobs/{video_job_id}.json", video/video_result_manifest.json, video/final_video_manifest.json]
    hard_gate: [callback.status == completed, composed_marker_exists, final_video_readable == true, final_video_sha256_matches == true]
    success_status: final_video_ready
    failure_status: video_compose_failed

  stage_95_pipeline_evidence:
    name: Episode Pipeline Evidence
    validator: deepwhite-00-novel-series-orchestrator/scripts/validate_episode_pipeline.py
    run_when: series_project == true
    output: review/series_pipeline_evidence.json
    hard_gate: passed == true

  stage_100_series_commit:
    name: Commit Episode to Series
    run_when: series_project == true
    inputs: [video/final_video_manifest.json, world/series_continuity_out.json, assets/series_asset_delta.json, review/series_pipeline_evidence.json]
    idempotency_marker: state/series_commit.done
    dispatch_next_requires_explicit_user_command: true

human_review:
  required_before: [external_publish, material_change_to_user_locked_story_or_style, unresolved_critical_after_two_revisions]
  not_required_before: [n8n_asset_dispatch, n8n_image_generation, final_shotlist_generation, video_prompt_generation, n8n_video_dispatch, n8n_video_generation, final_composition]

completion_contract:
  success_status: final_video_ready
  requires: [stage_90_final_composition.success_status == final_video_ready]
  conditional_requires:
    series_project: [stage_95_pipeline_evidence.passed == true, stage_100_series_commit.done == true]
  forbid_asset_only_completion: true
