schema_version: "2.1.0"
pipeline_profile: scene_bound_auto_v1.2
authority: mirror_index_only
must_match: drama-workflow.yaml
project: {name: AI Short Drama Production Pipeline, agent: drama-producer}

workflow:
  stage_10_screenplay:
    skill: deepwhite-screenwriting-v1
    output: [script/episode_script.md, script/scene_index.json]
  stage_20_world_state:
    skill: deepwhite-continuity-worldstate-zh
    invocation: {mode: AUTO_MACHINE_MODE}
    output: [world/characters.json, world/locations.json, world/props.json, continuity/continuity_handoff.json]
  stage_25_scene_asset_plan:
    skill: deepwhite-scene-asset-planner
    authority: scene_id_to_location_asset_binding
    output: [assets/scene_asset_plan.json, assets/location_asset_requirements.json, handoffs/scene_asset_handoff.json, gates/scene_asset_coverage_gate.json]
  stage_30_base_continuity_design:
    skill: deepwhite-scene-pack-builder
    invocation: {mode: PIPELINE_BATCH, pass: BASE_ASSET}
    constraint: preserve_scene_asset_handoff
  stage_32_base_prompt_packaging:
    skill: deepwhite-image-prompt-builder
    invocation: {mode: PACKAGER_ONLY, source_pass: BASE_ASSET}
  stage_35_base_asset_generation:
    skill: deepwhite-n8n-asset-dispatcher
    invocation: {mode: CONTINUITY_V2, stage_filter: anchor, wait_for_registry: true}
    success_requires: all_required_assets_approved
  stage_40_preliminary_shotlist:
    skill: deepwhite-shotlist-builder-zh-user
    purpose: discover_shot_asset_gaps_without_rebinding_scenes
  stage_42_shot_asset_gap:
    skill: deepwhite-scene-pack-builder
    invocation: {mode: PIPELINE_BATCH, pass: SHOT_ASSET_GAP}
  stage_44_shot_prompt_packaging:
    skill: deepwhite-image-prompt-builder
    invocation: {mode: PACKAGER_ONLY, source_pass: SHOT_ASSET_GAP}
  stage_46_derived_asset_generation:
    skill: deepwhite-n8n-asset-dispatcher
    invocation: {mode: CONTINUITY_V2, stage_filter: [derived, shot], wait_for_registry: true}
    success_requires: all_required_assets_approved
  stage_50_final_shotlist:
    skill: deepwhite-shotlist-builder-zh-user
    authority: actual_approved_assets_plus_scene_asset_handoff
  stage_60_transition:
    skill: deepwhite-shot-transition-builder-zh
    optional: true
    constraint: must_not_change_scene_or_location_binding
  stage_70_video_dispatch:
    skill: deepwhite-n8n-video-dispatcher
    success_requires: execution_or_result_evidence
  stage_90_final_composition: {action: verify_final_video}
  stage_95_pipeline_evidence: {skill: deepwhite-00-novel-series-orchestrator}
  stage_100_series_commit: {action: commit_verified_episode}

rules:
  authority_order:
    - script_scene_index
    - continuity_world_state
    - scene_asset_planner_handoff
    - scene_pack_child_asset_design
    - image_prompt_packaging
    - approved_reference_registry
    - final_shot_bindings
  hard_invariants:
    - scene_pack_never_replaces_scene_asset_planner
    - packager_never_rewrites_hard_locks
    - one_child_asset_one_image
    - registry_entries_bind_job_payload_lock_and_file_hash
    - rejected_or_failed_required_assets_never_count_as_success
    - http_2xx_never_means_generation_completed
    - final_video_ready_is_the_only_episode_success_status
  aspect_ratio_defaults:
    location: "16:9"
    scene: "16:9"
    character: "9:16"
    animal: "9:16"
    creature: "9:16"
    prop: "9:16"
    storyboard: "16:9"
    shot: "16:9"
  human_review_required_only_for: [external_publish, material_change_to_user_locked_story_or_style, unresolved_critical_after_two_revisions]
