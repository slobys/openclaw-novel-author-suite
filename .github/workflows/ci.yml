name: drama-pipeline-ci

on:
  push:
    branches: [drama-pipeline]
  pull_request:
    branches: [drama-pipeline]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scripts and deterministic gates
        run: bash tests/run-tests.sh
      - name: Verify repeat-safe installer
        run: bash tests/test-install.sh

