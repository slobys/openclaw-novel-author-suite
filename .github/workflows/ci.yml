name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --omit=peer --legacy-peer-deps
      - run: npm run verify
      - run: python -m unittest discover -s workspace-novel-author/skills/novel-author/tests -p 'test_*.py'
      - run: bash -n install.sh uninstall.sh tests/test-install.sh
      - run: bash tests/test-install.sh
      - run: node scripts/check-public-release.mjs
